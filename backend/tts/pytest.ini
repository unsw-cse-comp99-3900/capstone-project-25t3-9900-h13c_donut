[pytest]
# Pytest配置文件

# 测试目录
testpaths = tests

# 输出选项
addopts = 
    # 详细输出
    -v
    # 显示locals变量
    -l
    # 显示测试摘要
    -ra
    # 覆盖率报告
    --cov=domain
    --cov=adapters
    --cov=services
    --cov=utils
    --cov-report=term-missing
    --cov-report=html
    # 异步测试模式
    --asyncio-mode=auto
    # 显示print输出
    -s

# 标记定义
markers =
    unit: 单元测试
    integration: 集成测试
    slow: 慢速测试（需要真实API调用）

# 异步测试配置
asyncio_mode = auto

# 忽略警告
filterwarnings =
    ignore::DeprecationWarning
    ignore::PendingDeprecationWarning

# Python路径
pythonpath = .

